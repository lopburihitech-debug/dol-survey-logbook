<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานของฉัน — DOL Survey Logbook</title>
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/img/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="container">
  <h1>งานของฉัน</h1>
  <div class="subtitle">รายการเรื่อง รว.12 ที่ท่านรับผิดชอบอยู่ เรียงงานที่ยังไม่เสร็จ/ใกล้ครบกำหนดไว้บนสุด</div>

  <div class="card" id="filterCard" style="display:none;">
    <div class="filters">
      <input type="text" id="searchInput" placeholder="ค้นหา รว.12 หรือชื่อผู้ขอ...">
      <select id="typeFilter">
        <option value="">ทุกประเภทงาน</option>
      </select>
      <select id="statusFilter">
        <option value="">ทุกสถานะ</option>
      </select>
      <button class="btn btn-outline btn-sm" id="clearFiltersBtn" type="button">ล้างตัวกรอง</button>
    </div>
    <div class="subtitle" id="resultSummary" style="margin:-4px 0 0;"></div>
  </div>

  <div id="workCards"><div class="loading">กำลังโหลด...</div></div>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();

  // ไอคอนปฏิทินเล็กๆ หน้าแถววันนัดรังวัด — วาดเองด้วย stroke=currentColor ชุดเดียวกับที่ใช้ในเมนูบน (api.js NAV_ICONS)
  const CAL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px; height:14px; flex-shrink:0; vertical-align:-2px;"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;

  // เรื่องที่ถือว่า "จบงานแล้ว" — ใช้จัดลำดับ (ดันไปท้ายสุด) และลดความเด่นของสีขอบการ์ด ไม่เกี่ยวกับ
  // OVERDUE_EXCLUDED_STATUSES ด้านล่างซึ่งกว้างกว่า (มีสถานะที่ยัง "เปิดอยู่" แต่ไม่นับเกินนัดด้วย)
  const CLOSED_SET = new Set(["COMPLETED", "CLOSED", "CANCELLED"]);

  // สถานะที่ถือว่า "จบงานแล้ว" ไม่ต้องแสดงป้ายเกินนัด แม้จะเลยวันนัดรังวัดมานานแค่ไหนก็ตาม — ตรงกับ cases.html/
  // surveyor-profile.html เพื่อให้ตัวเลข/ป้ายเกินนัดตรงกันทั้งระบบ
  const OVERDUE_EXCLUDED_STATUSES = new Set(["CLOSED", "CANCELLED", "SURVEY_SKIPPED", "RE_APPOINTMENT_NEEDED", "POSTPONED", "SURVEY_DONE"]);

  // ลำดับสถานะตามขั้นตอนงานจริง ใช้เรียงตัวเลือกในตัวกรองสถานะให้อ่านง่าย (ไม่ใช่เรียงตามตัวอักษร)
  const STATUS_ORDER = [
    "RECEIVED", "WAITING_ASSIGNMENT", "ASSIGNED", "APPOINTED", "SURVEY_DONE",
    "POSTPONED", "SURVEY_SKIPPED", "RE_APPOINTMENT_NEEDED", "REWORK_REQUIRED",
    "CLOSED", "CANCELLED",
  ];

  let allCases = [];
  let typeMap = {};
  const filters = { search: "", typeId: "", status: "" };

  async function init() {
    const user = await renderTopbar("my-work");
    if (!user) return;
    if (user.role !== "surveyor") {
      window.location.href = "/dashboard.html";
      return;
    }
    bindFilterControls();
    await loadMyCases();
  }

  async function loadMyCases() {
    const types = await apiFetch("/survey-types");
    typeMap = {};
    (types || []).forEach((t) => (typeMap[t.id] = t.name));

    // /survey-cases ถูก scope ให้เห็นเฉพาะงานของตัวเองอยู่แล้วสำหรับบทบาทช่างรังวัด (ดู helpers.scope_case_filter)
    allCases = (await apiFetch("/survey-cases")) || [];

    if (allCases.length === 0) {
      document.getElementById("workCards").innerHTML = `<div class="card empty-state">ยังไม่มีงานที่ได้รับมอบหมายในขณะนี้</div>`;
      return;
    }

    document.getElementById("filterCard").style.display = "";
    setupTypeFilterOptions();
    setupStatusFilterOptions();
    renderFilteredList();
  }

  // ---------------------------------------------------------------------------
  // ตัวกรอง — ทำฝั่ง client ล้วนๆ จากข้อมูลที่โหลดมาครั้งเดียว (allCases) เพราะจำนวนงานของช่างคนหนึ่งไม่มากพอ
  // ที่จะต้องยิง API ซ้ำทุกครั้งที่เปลี่ยนตัวกรอง — พิมพ์/เลือกแล้วเห็นผลทันที
  // ---------------------------------------------------------------------------
  function setupTypeFilterOptions() {
    const sel = document.getElementById("typeFilter");
    const idsPresent = [...new Set(allCases.map((c) => c.survey_type_id).filter(Boolean))];
    const options = idsPresent
      .map((id) => ({ id, name: typeMap[id] || id }))
      .sort((a, b) => a.name.localeCompare(b.name, "th"));
    sel.innerHTML = `<option value="">ทุกประเภทงาน</option>` + options.map((o) => `<option value="${o.id}">${o.name}</option>`).join("");
    sel.value = filters.typeId;
  }

  function setupStatusFilterOptions() {
    const sel = document.getElementById("statusFilter");
    const present = new Set(allCases.map((c) => c.status));
    const ordered = STATUS_ORDER.filter((s) => present.has(s));
    // เผื่อสถานะเก่าที่ไม่อยู่ใน STATUS_ORDER (ข้อมูลเก่า) — ต่อท้ายไว้ไม่ให้หายไปจากตัวกรอง
    [...present].forEach((s) => { if (!ordered.includes(s)) ordered.push(s); });
    sel.innerHTML = `<option value="">ทุกสถานะ</option>` + ordered.map((s) => `<option value="${s}">${STATUS_LABELS[s] || s}</option>`).join("");
    sel.value = filters.status;
  }

  function bindFilterControls() {
    const debounce = (fn, ms) => {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), ms);
      };
    };
    document.getElementById("searchInput").addEventListener(
      "input",
      debounce((e) => {
        filters.search = e.target.value.trim();
        renderFilteredList();
      }, 150)
    );
    document.getElementById("typeFilter").addEventListener("change", (e) => {
      filters.typeId = e.target.value;
      renderFilteredList();
    });
    document.getElementById("statusFilter").addEventListener("change", (e) => {
      filters.status = e.target.value;
      renderFilteredList();
    });
    document.getElementById("clearFiltersBtn").addEventListener("click", () => {
      filters.search = "";
      filters.typeId = "";
      filters.status = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("typeFilter").value = "";
      document.getElementById("statusFilter").value = "";
      renderFilteredList();
    });
  }

  // แสดงป้าย "เกิน 30 วัน" / "เกิน 60 วัน" นับจากวันนัดรังวัด (appointment_date) — งานที่ยังไม่ครบ 30 วัน,
  // ไม่มีวันนัดรังวัด, หรือจบงาน/พ้นขั้นตอนรังวัดไปแล้วจะไม่แสดงป้าย (คืนค่าว่าง)
  function appointmentOverdueBadge(c) {
    if (OVERDUE_EXCLUDED_STATUSES.has(c.status)) return "";
    if (!c.appointment_date) return "";
    const appt = new Date(c.appointment_date);
    if (isNaN(appt.getTime())) return "";
    const diffDays = Math.floor((new Date() - appt) / (24 * 60 * 60 * 1000));
    if (diffDays >= 60) return `<span class="badge status-CANCELLED">เกิน 60 วัน</span>`;
    if (diffDays >= 30) return `<span class="badge status-ASSIGNED">เกิน 30 วัน</span>`;
    return "";
  }

  function renderFilteredList() {
    const box = document.getElementById("workCards");
    const q = filters.search.toLowerCase();
    let list = allCases.filter((c) => {
      if (filters.typeId && c.survey_type_id !== filters.typeId) return false;
      if (filters.status && c.status !== filters.status) return false;
      if (q) {
        const haystack = `${c.case_code || ""} ${c.requester_name || ""}`.toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });

    list = list.slice().sort((a, b) => {
      const aOpen = !CLOSED_SET.has(a.status), bOpen = !CLOSED_SET.has(b.status);
      if (aOpen !== bOpen) return aOpen ? -1 : 1;
      return (a.due_date || "").localeCompare(b.due_date || "");
    });

    document.getElementById("resultSummary").textContent = `แสดง ${list.length} จาก ${allCases.length} เรื่อง`;

    if (list.length === 0) {
      box.innerHTML = `<div class="card empty-state">ไม่พบงานที่ตรงกับตัวกรอง</div>`;
      return;
    }

    box.innerHTML = list
      .map((c) => {
        const overdueBadge = appointmentOverdueBadge(c);
        const borderColor = CLOSED_SET.has(c.status) ? "var(--text-muted)" : (overdueBadge ? "var(--danger)" : "var(--primary)");
        const apptLine = c.appointment_date
          ? `${CAL_ICON} วันนัดรังวัด: <strong>${fmtDateOnly(c.appointment_date)}</strong>`
          : `<span style="color:var(--text-muted);">ยังไม่มีวันนัดรังวัด</span>`;
        return `
        <div class="card work-card" style="border-left:4px solid ${borderColor};" onclick="window.location.href='/case.html?id=${c.id}'">
          <div class="wc-top">
            <div>
              <div class="wc-code">${c.case_code}</div>
              <div class="subtitle" style="margin:2px 0 0 0;">${c.requester_name} · ${typeMap[c.survey_type_id] || "-"}</div>
            </div>
            <div class="wc-badges">
              ${statusBadge(c.status)}
              ${overdueBadge}
            </div>
          </div>
          <div class="wc-appt">${apptLine}</div>
        </div>`;
      })
      .join("");
  }

  init();
</script>
</body>
</html>
